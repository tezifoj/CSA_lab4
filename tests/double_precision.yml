in_source: |
  (define fa (makestring 2))
  (define fb (makestring 2))
  (define tmp (makestring 2))
  (define limbs (makestring 4))
  (define digits (makestring 24))

  (defun digitp (c)
    (if (< c #\0) 0 (if (> c #\9) 0 1)))

  (defun read-digits (c acc)
    (if (digitp c)
        (read-digits (readchar) (+ (* acc 10) (- c #\0)))
        acc))

  ; младшие и старшие 16 бит слова как беззнаковые числа
  (defun lo16 (x)
    (let ((r (% x 65536)))
      (if (< r 0) (+ r 65536) r)))

  (defun hi16 (x)
    (let ((h (if (< (% x 65536) 0) (- (/ x 65536) 1) (/ x 65536))))
      (if (< h 0) (+ h 65536) h)))

  ; dst = x + y, перенос передаётся между 16-битными частями
  (defun add64 (dst x y)
    (let ((s0 (+ (lo16 (getchar x 0)) (lo16 (getchar y 0))))
          (s1 (+ (+ (hi16 (getchar x 0)) (hi16 (getchar y 0))) (/ s0 65536)))
          (s2 (+ (+ (lo16 (getchar x 1)) (lo16 (getchar y 1))) (/ s1 65536)))
          (s3 (+ (+ (hi16 (getchar x 1)) (hi16 (getchar y 1))) (/ s2 65536))))
      (setchar dst 0 (+ (* (% s1 65536) 65536) (% s0 65536)))
      (setchar dst 1 (+ (* (% s3 65536) 65536) (% s2 65536)))))

  (defun copy64 (dst src)
    (progn
      (setchar dst 0 (getchar src 0))
      (setchar dst 1 (getchar src 1))))

  ; делит limbs (4 цифры по основанию 65536) на 10, возвращает остаток
  (defun div10 ()
    (let ((r 0))
      (loop for k from 0 to 3 do
        (let ((cur (+ (* r 65536) (getchar limbs (- 3 k)))))
          (setchar limbs (- 3 k) (/ cur 10))
          (setq r (% cur 10))))
      r))

  (defun limbs-zero ()
    (= (+ (+ (getchar limbs 0) (getchar limbs 1))
          (+ (getchar limbs 2) (getchar limbs 3)))
       0))

  ; кладёт десятичные цифры в digits от младшей, возвращает их число
  (defun collect (n)
    (progn
      (setchar digits n (+ #\0 (div10)))
      (if (limbs-zero) (+ n 1) (collect (+ n 1)))))

  (defun print64 (x)
    (progn
      (setchar limbs 0 (lo16 (getchar x 0)))
      (setchar limbs 1 (hi16 (getchar x 0)))
      (setchar limbs 2 (lo16 (getchar x 1)))
      (setchar limbs 3 (hi16 (getchar x 1)))
      (let ((n (collect 0)))
        (loop for k from 1 to n do (printchar (getchar digits (- n k)))))))

  (define n (read-digits (readchar) 0))
  (setchar fb 0 1)
  (loop for i from 1 to n do
    (progn
      (add64 tmp fa fb)
      (copy64 fa fb)
      (copy64 fb tmp)))
  (print64 fa)
  (printchar 10)
