        arg: Num 2
    Define limbs
      value: Call makestring
        arg: Num 4
    Define digits
      value: Call makestring
        arg: Num 24
    Defun digitp(c)
      body: If
        cond: BinOp <
          left: Var c
          right: Num 48
        then: Num 0
        else: If
          cond: BinOp >
            left: Var c
            right: Num 57
          then: Num 0
          else: Num 1
    Defun read-digits(c acc)
      body: If
        cond: Call digitp
          arg: Var c
        then: Call read-digits
          arg: Call readchar
          arg: BinOp +
            left: BinOp *
              left: Var acc
              right: Num 10
            right: BinOp -
              left: Var c
              right: Num 48
        else: Var acc
    Defun lo16(x)
      body: Let
        bind r: BinOp %
          left: Var x
          right: Num 65536
        body: If
          cond: BinOp <
            left: Var r
            right: Num 0
          then: BinOp +
            left: Var r
            right: Num 65536
          else: Var r
    Defun hi16(x)
      body: Let
        bind h: If
          cond: BinOp <
            left: BinOp %
              left: Var x
              right: Num 65536
            right: Num 0
          then: BinOp -
            left: BinOp /
              left: Var x
              right: Num 65536
            right: Num 1
          else: BinOp /
            left: Var x
            right: Num 65536
        body: If
          cond: BinOp <
            left: Var h
            right: Num 0
          then: BinOp +
            left: Var h
            right: Num 65536
          else: Var h
    Defun add64(dst x y)
      body: Let
        bind s0: BinOp +
          left: Call lo16
            arg: Call getchar
              arg: Var x
              arg: Num 0
          right: Call lo16
            arg: Call getchar
              arg: Var y
              arg: Num 0
        bind s1: BinOp +
          left: BinOp +
            left: Call hi16
              arg: Call getchar
                arg: Var x
                arg: Num 0
            right: Call hi16
              arg: Call getchar
                arg: Var y
                arg: Num 0
          right: BinOp /
            left: Var s0
            right: Num 65536
        bind s2: BinOp +
          left: BinOp +
            left: Call lo16
              arg: Call getchar
                arg: Var x
                arg: Num 1
            right: Call lo16
              arg: Call getchar
                arg: Var y
                arg: Num 1
          right: BinOp /
            left: Var s1
            right: Num 65536
        bind s3: BinOp +
          left: BinOp +
            left: Call hi16
              arg: Call getchar
                arg: Var x
                arg: Num 1
            right: Call hi16
              arg: Call getchar
                arg: Var y
                arg: Num 1
          right: BinOp /
            left: Var s2
            right: Num 65536
        body: Call setchar
          arg: Var dst
          arg: Num 0
          arg: BinOp +
            left: BinOp *
              left: BinOp %
                left: Var s1
                right: Num 65536
              right: Num 65536
            right: BinOp %
              left: Var s0
              right: Num 65536
        body: Call setchar
          arg: Var dst
          arg: Num 1
          arg: BinOp +
            left: BinOp *
              left: BinOp %
                left: Var s3
                right: Num 65536
              right: Num 65536
            right: BinOp %
              left: Var s2
              right: Num 65536
    Defun copy64(dst src)
      body: Progn
        Call setchar
          arg: Var dst
          arg: Num 0
          arg: Call getchar
            arg: Var src
            arg: Num 0
        Call setchar
          arg: Var dst
          arg: Num 1
          arg: Call getchar
            arg: Var src
            arg: Num 1
    Defun div10()
      body: Let
        bind r: Num 0
        body: Loop k
          from: Num 0
          to: Num 3
          do: Let
            bind cur: BinOp +
              left: BinOp *
                left: Var r
                right: Num 65536
              right: Call getchar
                arg: Var limbs
                arg: BinOp -
                  left: Num 3
                  right: Var k
            body: Call setchar
              arg: Var limbs
              arg: BinOp -
                left: Num 3
                right: Var k
              arg: BinOp /
                left: Var cur
                right: Num 10
            body: Setq r
              value: BinOp %
                left: Var cur
                right: Num 10
        body: Var r
    Defun limbs-zero()
      body: BinOp =
        left: BinOp +
          left: BinOp +
            left: Call getchar
              arg: Var limbs
              arg: Num 0
            right: Call getchar
              arg: Var limbs
              arg: Num 1
          right: BinOp +
            left: Call getchar
              arg: Var limbs
              arg: Num 2
            right: Call getchar
              arg: Var limbs
              arg: Num 3
        right: Num 0
    Defun collect(n)
      body: Progn
        Call setchar
          arg: Var digits
          arg: Var n
          arg: BinOp +
            left: Num 48
            right: Call div10
        If
          cond: Call limbs-zero
          then: BinOp +
            left: Var n
            right: Num 1
          else: Call collect
            arg: BinOp +
              left: Var n
              right: Num 1
    Defun print64(x)
      body: Progn
        Call setchar
          arg: Var limbs
          arg: Num 0
          arg: Call lo16
            arg: Call getchar
              arg: Var x
              arg: Num 0
        Call setchar
          arg: Var limbs
          arg: Num 1
          arg: Call hi16
            arg: Call getchar
              arg: Var x
              arg: Num 0
        Call setchar
          arg: Var limbs
          arg: Num 2
          arg: Call lo16
            arg: Call getchar
              arg: Var x
              arg: Num 1
        Call setchar
          arg: Var limbs
          arg: Num 3
          arg: Call hi16
            arg: Call getchar
              arg: Var x
              arg: Num 1
        Let
          bind n: Call collect
            arg: Num 0
          body: Loop k
            from: Num 1
            to: Var n
            do: Call printchar
              arg: Call getchar
                arg: Var digits
                arg: BinOp -
                  left: Var n
                  right: Var k
    Define n
      value: Call read-digits
        arg: Call readchar
        arg: Num 0
    Call setchar
      arg: Var fb
      arg: Num 0
      arg: Num 1
    Loop i
      from: Num 1
      to: Var n
      do: Progn
        Call add64
          arg: Var tmp
          arg: Var fa
          arg: Var fb
        Call copy64
          arg: Var fa
          arg: Var fb
        Call copy64
          arg: Var fb
          arg: Var tmp
    Call print64
      arg: Var fa
    Call printchar
      arg: Num 10
