  cache_lines: 4
out_ast: |
  Program
    Define xs
      value: Call makestring
        arg: Num 32
    Define count
      value: Num 0
    Define last
      value: Num 0
    Defun digitp(c)
      body: If
        cond: BinOp <
          left: Var c
          right: Num 48
        then: Num 0
        else: If
          cond: BinOp >
            left: Var c
            right: Num 57
          then: Num 0
          else: Num 1
    Defun skip-spaces(c)
      body: If
        cond: BinOp =
          left: Var c
          right: Num 32
        then: Call skip-spaces
          arg: Call readchar
        else: Var c
    Defun read-digits(c acc)
      body: If
        cond: Call digitp
          arg: Var c
        then: Call read-digits
          arg: Call readchar
          arg: BinOp +
            left: BinOp *
              left: Var acc
              right: Num 10
            right: BinOp -
              left: Var c
              right: Num 48
        else: Progn
          Setq last
            value: Var c
          Var acc
    Defun read-list(c)
      body: Let
        bind d: Call skip-spaces
          arg: Var c
        body: If
          cond: BinOp =
            left: Var d
            right: Num 10
          then: Var count
          else: Progn
            Call setchar
              arg: Var xs
              arg: Var count
              arg: Call read-digits
                arg: Var d
                arg: Num 0
            Setq count
              value: BinOp +
                left: Var count
                right: Num 1
            Call read-list
              arg: Var last
    Call read-list
      arg: Call readchar
    Loop i
      from: Num 1
      to: BinOp -
        left: Var count
        right: Num 2
      do: Progn
        If
          cond: BinOp >
            left: Var i
            right: Num 1
          then: Call printchar
            arg: Num 32
          else: Num 0
        Call printnumber
          arg: BinOp /
            left: BinOp +
              left: BinOp +
                left: Call getchar
                  arg: Var xs
                  arg: BinOp -
                    left: Var i
                    right: Num 1
                right: Call getchar
                  arg: Var xs
                  arg: Var i
              right: Call getchar
                arg: Var xs
                arg: BinOp +
                  left: Var i
                  right: Num 1
            right: Num 3
    Call printchar
      arg: Num 10
