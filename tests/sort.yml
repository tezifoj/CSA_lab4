in_source: |
  ; ввод: целые числа через пробел, конец списка -- перенос строки
  ; вывод: те же числа по возрастанию
  (define nums (makestring 32))
  (define count 0)
  (define last 0)

  (defun digitp (c)
    (if (< c #\0) 0 (if (> c #\9) 0 1)))

  (defun skip-spaces (c)
    (if (= c 32) (skip-spaces (readchar)) c))

  ; читает цифры, начиная с символа c; символ после числа кладёт в last
  (defun read-digits (c acc)
    (if (digitp c)
        (read-digits (readchar) (+ (* acc 10) (- c #\0)))
        (progn (setq last c) acc)))

  (defun read-number (c)
    (if (= c #\-)
        (- 0 (read-digits (readchar) 0))
        (read-digits c 0)))

  (defun read-list (c)
    (let ((d (skip-spaces c)))
      (if (= d 10)
          count
          (progn
            (setchar nums count (read-number d))
            (setq count (+ count 1))
            (read-list last)))))

  (read-list (readchar))

  ; сортировка пузырьком
  (loop for i from 0 to (- count 2) do
    (loop for j from 0 to (- count (+ i 2)) do
      (let ((a (getchar nums j))
            (b (getchar nums (+ j 1))))
        (if (> a b)
            (progn (setchar nums j b) (setchar nums (+ j 1) a))
            0))))

  (loop for i from 0 to (- count 1) do
    (progn
      (if (> i 0) (printchar 32) 0)
      (printnumber (getchar nums i))))
  (printchar 10)
in_input: '[(100, ''5''), (600, '' ''), (1100, ''-''), (1600, ''3''), (2100, '' ''), (2600, ''1''), (3100, ''2''), (3600, '' ''), (4100, ''0''), (4600, '' ''), (5100, ''7''), (5600, '' ''), (6100, ''-''), (6600, ''1''), (7100, ''0''), (7600, '' ''), (8100, ''4''), (8600, ''\n'')]'
out_ast: |
  Program
    Define nums
      value: Call makestring
        arg: Num 32
    Define count
      value: Num 0
    Define last
      value: Num 0
    Defun digitp(c)
      body: If
        cond: BinOp <
          left: Var c
          right: Num 48
        then: Num 0
        else: If
          cond: BinOp >
            left: Var c
            right: Num 57
          then: Num 0
          else: Num 1
    Defun skip-spaces(c)
      body: If
        cond: BinOp =
          left: Var c
          right: Num 32
        then: Call skip-spaces
          arg: Call readchar
        else: Var c
    Defun read-digits(c acc)
      body: If
        cond: Call digitp
          arg: Var c
        then: Call read-digits
          arg: Call readchar
          arg: BinOp +
            left: BinOp *
              left: Var acc
              right: Num 10
            right: BinOp -
              left: Var c
              right: Num 48
        else: Progn
          Setq last
            value: Var c
          Var acc
    Defun read-number(c)
      body: If
        cond: BinOp =
          left: Var c
          right: Num 45
        then: BinOp -
          left: Num 0
          right: Call read-digits
            arg: Call readchar
            arg: Num 0
        else: Call read-digits
          arg: Var c
          arg: Num 0
    Defun read-list(c)
      body: Let
        bind d: Call skip-spaces
          arg: Var c
        body: If
          cond: BinOp =
            left: Var d
            right: Num 10
          then: Var count
          else: Progn
            Call setchar
              arg: Var nums
              arg: Var count
              arg: Call read-number
                arg: Var d
            Setq count
              value: BinOp +
                left: Var count
                right: Num 1
            Call read-list
              arg: Var last
    Call read-list
      arg: Call readchar
    Loop i
      from: Num 0
      to: BinOp -
        left: Var count
        right: Num 2
      do: Loop j
        from: Num 0
        to: BinOp -
          left: Var count
          right: BinOp +
            left: Var i
            right: Num 2
        do: Let
          bind a: Call getchar
            arg: Var nums
            arg: Var j
          bind b: Call getchar
            arg: Var nums
            arg: BinOp +
              left: Var j
              right: Num 1
          body: If
            cond: BinOp >
              left: Var a
              right: Var b
            then: Progn
              Call setchar
                arg: Var nums
                arg: Var j
                arg: Var b
              Call setchar
                arg: Var nums
                arg: BinOp +
                  left: Var j
                  right: Num 1
                arg: Var a
            else: Num 0
    Loop i
      from: Num 0
      to: BinOp -
        left: Var count
        right: Num 1
      do: Progn
        If
          cond: BinOp >
            left: Var i
            right: Num 0
          then: Call printchar
            arg: Num 32
          else: Num 0
        Call printnumber
          arg: Call getchar
            arg: Var nums
            arg: Var i
    Call printchar
      arg: Num 10
