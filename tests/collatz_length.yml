in_source: |
  ; ввод: натуральное число n
  ; вывод: число шагов до 1 в последовательности Коллатца
  (defun digitp (c)
    (if (< c #\0) 0 (if (> c #\9) 0 1)))

  (defun read-digits (c acc)
    (if (digitp c)
        (read-digits (readchar) (+ (* acc 10) (- c #\0)))
        acc))

  (defun collatz (n steps)
    (if (= n 1)
        steps
        (if (= (% n 2) 0)
            (collatz (/ n 2) (+ steps 1))
            (collatz (+ (* n 3) 1) (+ steps 1)))))

  (define n (read-digits (readchar) 0))
  (printnumber (if (< n 1) -1 (collatz n 0)))
  (printchar 10)
in_input: |
  [(100, '2'), (600, '7'), (1100, '\n')]
out_ast: |
  Program
    Defun digitp(c)
      body: If
        cond: BinOp <
          left: Var c
          right: Num 48
        then: Num 0
        else: If
          cond: BinOp >
            left: Var c
            right: Num 57
          then: Num 0
          else: Num 1
    Defun read-digits(c acc)
      body: If
        cond: Call digitp
          arg: Var c
        then: Call read-digits
          arg: Call readchar
          arg: BinOp +
            left: BinOp *
              left: Var acc
              right: Num 10
            right: BinOp -
              left: Var c
              right: Num 48
        else: Var acc
    Defun collatz(n steps)
      body: If
        cond: BinOp =
          left: Var n
          right: Num 1
        then: Var steps
        else: If
          cond: BinOp =
            left: BinOp %
              left: Var n
              right: Num 2
            right: Num 0
          then: Call collatz
            arg: BinOp /
              left: Var n
              right: Num 2
            arg: BinOp +
              left: Var steps
              right: Num 1
          else: Call collatz
            arg: BinOp +
              left: BinOp *
                left: Var n
                right: Num 3
              right: Num 1
            arg: BinOp +
              left: Var steps
              right: Num 1
    Define n
      value: Call read-digits
        arg: Call readchar
        arg: Num 0
    Call printnumber
      arg: If
        cond: BinOp <
          left: Var n
          right: Num 1
        then: Num -1
        else: Call collatz
          arg: Var n
          arg: Num 0
    Call printchar
      arg: Num 10
