in_source: |
  ; любая форма - выражение и возвращает значение
  (define x 1)
  (printstring (if (= 1 x) "T" "F"))
  (printchar 10)
  (setq x (if (= 1 x) 2 3))
  (printnumber x)
  (printchar 10)
  (setq x (loop for i from 1 to 4 do (* i 10)))
  (printnumber x)
  (printchar 10)
  (printnumber (setq x 13))
  (printchar 10)
  (printnumber (let ((a 5) (b (* a 2))) (+ a b)))
  (printchar 10)
  (printnumber (progn 1 2 3))
  (printchar 10)
  (printnumber (loop for i from 1 to 0 do 100))
  (printchar 10)
in_input: '[]'
out_ast: |
  Program
    Define x
      value: Num 1
    Call printstring
      arg: If
        cond: BinOp =
          left: Num 1
          right: Var x
        then: Str 'T'
        else: Str 'F'
    Call printchar
      arg: Num 10
    Setq x
      value: If
        cond: BinOp =
          left: Num 1
          right: Var x
        then: Num 2
        else: Num 3
    Call printnumber
      arg: Var x
    Call printchar
      arg: Num 10
    Setq x
      value: Loop i
        from: Num 1
        to: Num 4
        do: BinOp *
          left: Var i
          right: Num 10
    Call printnumber
      arg: Var x
    Call printchar
      arg: Num 10
    Call printnumber
      arg: Setq x
        value: Num 13
    Call printchar
      arg: Num 10
    Call printnumber
      arg: Let
        bind a: Num 5
        bind b: BinOp *
          left: Var a
          right: Num 2
        body: BinOp +
          left: Var a
          right: Var b
    Call printchar
      arg: Num 10
    Call printnumber
      arg: Progn
        Num 1
        Num 2
        Num 3
    Call printchar
      arg: Num 10
    Call printnumber
      arg: Loop i
        from: Num 1
        to: Num 0
        do: Num 100
    Call printchar
      arg: Num 10
