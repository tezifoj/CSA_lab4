out_ast: |
  Program
    Define ops
      value: Call makestring
        arg: Num 32
    Define top
      value: Num 0
    Defun prec(c)
      body: If
        cond: BinOp =
          left: Var c
          right: Num 43
        then: Num 1
        else: If
          cond: BinOp =
            left: Var c
            right: Num 45
          then: Num 1
          else: If
            cond: BinOp =
              left: Var c
              right: Num 42
            then: Num 2
            else: If
              cond: BinOp =
                left: Var c
                right: Num 47
              then: Num 2
              else: Num 0
    Defun push-op(c)
      body: Progn
        Call setchar
          arg: Var ops
          arg: Var top
          arg: Var c
        Setq top
          value: BinOp +
            left: Var top
            right: Num 1
    Defun pop-op()
      body: Progn
        Setq top
          value: BinOp -
            left: Var top
            right: Num 1
        Call getchar
          arg: Var ops
          arg: Var top
    Defun peek-op()
      body: If
        cond: BinOp =
          left: Var top
          right: Num 0
        then: Num 0
        else: Call getchar
          arg: Var ops
          arg: BinOp -
            left: Var top
            right: Num 1
    Defun flush(p)
      body: If
        cond: BinOp =
          left: Var top
          right: Num 0
        then: Num 0
        else: If
          cond: BinOp <
            left: Call prec
              arg: Call peek-op
            right: Var p
          then: Num 0
          else: Progn
            Call printchar
              arg: Call pop-op
            Call flush
              arg: Var p
    Defun close-paren()
      body: If
        cond: BinOp =
          left: Call peek-op
          right: Num 40
        then: Call pop-op
        else: Progn
          Call printchar
            arg: Call pop-op
          Call close-paren
    Defun convert(c)
      body: If
        cond: BinOp =
          left: Var c
          right: Num 10
        then: Call flush
          arg: Num 0
        else: Progn
          If
            cond: BinOp =
              left: Var c
              right: Num 40
            then: Call push-op
              arg: Var c
            else: If
              cond: BinOp =
                left: Var c
                right: Num 41
              then: Call close-paren
              else: If
                cond: BinOp >
                  left: Call prec
                    arg: Var c
                  right: Num 0
                then: Progn
                  Call flush
                    arg: Call prec
                      arg: Var c
                  Call push-op
                    arg: Var c
                else: If
                  cond: BinOp =
                    left: Var c
                    right: Num 32
                  then: Num 0
                  else: Call printchar
                    arg: Var c
          Call convert
            arg: Call readchar
    Call convert
      arg: Call readchar
    Call printchar
      arg: Num 10
