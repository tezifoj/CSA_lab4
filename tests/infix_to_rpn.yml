in_source: |
  ; ввод: выражение из однобуквенных операндов, + - * / и скобок, конец - перенос строки
  ; вывод: то же выражение в обратной польской записи
  (define ops (makestring 32))
  (define top 0)

  (defun prec (c)
    (if (= c #\+) 1
        (if (= c #\-) 1
            (if (= c #\*) 2
                (if (= c #\/) 2 0)))))

  (defun push-op (c)
    (progn (setchar ops top c) (setq top (+ top 1))))

  (defun pop-op ()
    (progn (setq top (- top 1)) (getchar ops top)))

  (defun peek-op ()
    (if (= top 0) 0 (getchar ops (- top 1))))

  ; выводит операторы со стека, пока их приоритет не меньше p
  (defun flush (p)
    (if (= top 0)
        0
        (if (< (prec (peek-op)) p)
            0
            (progn (printchar (pop-op)) (flush p)))))

  ; выводит операторы до открывающей скобки и снимает её
  (defun close-paren ()
    (if (= (peek-op) 40)
        (pop-op)
        (progn (printchar (pop-op)) (close-paren))))

  (defun convert (c)
    (if (= c 10)
        (flush 0)
        (progn
          (if (= c 40)
              (push-op c)
              (if (= c 41)
                  (close-paren)
                  (if (> (prec c) 0)
                      (progn (flush (prec c)) (push-op c))
                      (if (= c 32) 0 (printchar c)))))
          (convert (readchar)))))

  (convert (readchar))
  (printchar 10)
